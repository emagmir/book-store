apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bs-lb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=test
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: kubemaster.netopsfusion.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bs-fe-dep
                port:
                  number: 80
    - host: api.kubemaster.netopsfusion.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bs-be-dep
                port:
                  number: 80
