apiVersion: v1
kind: Service
metadata:
  name: bs-fe-dep
  namespace: default  # Make sure to specify the namespace if needed
spec:
  selector:
    app: bs-fe-dep
  ports:
    - port: 80            # Port to be exposed by the service
      targetPort: 3000      # Container port the service routes to
      name: bs-fe-svc
      protocol: TCP           # Change to ClusterIP if only internal access is needed